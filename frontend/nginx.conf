server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx:alpine 의 기본 mime.types 에는 .mjs 매핑이 없다. 그래서 ESM 모듈
    # (PDF.js worker 등)이 application/octet-stream 으로 서빙되고, 브라우저가
    # "Strict MIME type checking" 때문에 module script 로딩을 거부한다.
    # .mjs 만 자바스크립트 타입으로 덮어쓴다.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # SPA 라우팅: 모든 경로를 index.html 로 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
