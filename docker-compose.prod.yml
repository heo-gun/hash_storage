# 프로덕션 DB 는 RDS 를 쓴다. postgres 컨테이너는 없으며,
# infra/postgres/init/*.sql 은 psql 로 직접 적용해야 한다 (docs/DEPLOY.md 참고).
services:
  backend:
    build:
      context: ./backend
    container_name: fms-backend
    restart: always
    environment:
      FLASK_APP: run.py
      FLASK_ENV: production
      FLASK_DEBUG: "0"

      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}

      # AWS S3: IAM Role 사용 시 빈 값으로 명시 (config.py 기본값 덮어쓰기 위함)
      S3_ENDPOINT_URL: ""
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_USE_SSL: "true"

      # Cognito (Phase 2) — 컨테이너로 명시 전달 필수
      COGNITO_REGION: ${COGNITO_REGION:-ap-northeast-2}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      AUTH_DEV_BYPASS: "false"

      # .epf 보호 공유 (Phase 3)
      EPF_MASTER_KEY: ${EPF_MASTER_KEY}
      PUBLIC_BASE_URL: https://${DOMAIN}

      # 프론트엔드가 같은 도메인에서 서빙되므로 그 외 출처는 허용하지 않는다.
      # (미설정 시 config 기본값이 "*" 라 반드시 명시한다)
      CORS_ORIGINS: https://${DOMAIN}
    # 포트 외부 노출 없음 (Nginx가 내부 프록시)
    networks:
      - internal
    # Gunicorn: workers = (2 * CPU) + 1 권장, 최소 2
    command: >
      gunicorn
        --bind 0.0.0.0:5000
        --workers ${GUNICORN_WORKERS:-3}
        --timeout 120
        --access-logfile -
        --error-logfile -
        run:app

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: /api
        VITE_COGNITO_REGION: ${COGNITO_REGION:-ap-northeast-2}
        VITE_COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
        VITE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
        VITE_COGNITO_DOMAIN: ${COGNITO_DOMAIN}
        VITE_COGNITO_REDIRECT_URI: https://${DOMAIN}/auth/callback
    container_name: fms-frontend
    restart: always
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: fms-nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/templates/default.conf.template
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    networks:
      - internal

volumes:
  certbot_webroot:

networks:
  internal:
    driver: bridge
