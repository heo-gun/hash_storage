services:
  postgres:
    image: postgres:17-alpine
    container_name: fms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fms}
      POSTGRES_USER: ${POSTGRES_USER:-fms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fms_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fms_user} -d ${POSTGRES_DB:-fms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: fms-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    container_name: fms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-fms-bucket}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/$$S3_BUCKET_NAME;
        echo 'Bucket ready: '$$S3_BUCKET_NAME;
      "
    restart: on-failure

  backend:
    build:
      context: ./backend
    container_name: fms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
      FLASK_DEBUG: "1"

      POSTGRES_DB: ${POSTGRES_DB:-fms}
      POSTGRES_USER: ${POSTGRES_USER:-fms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fms_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-fms-bucket}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_USE_SSL: "false"

      # Cognito (Phase 2) — 비어있을 수 있음, AUTH_DEV_BYPASS=true면 우회
      COGNITO_REGION: ${COGNITO_REGION:-ap-northeast-2}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-true}

      # .epf 보호 공유 (Phase 3). 개발 기본값은 고정 더미 키다.
      # 프로덕션에서는 반드시 .env 의 EPF_MASTER_KEY 로 덮어쓸 것.
      EPF_MASTER_KEY: ${EPF_MASTER_KEY:-Y2FzdG9yLWRldi1vbmx5LWtleS1ub3QtZm9yLXByb2Q=}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    working_dir: /app
    # 개발 모드: flask dev 서버 (Gunicorn은 Dockerfile CMD 기본값)
    command: flask run --host=0.0.0.0 --port=5000

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: fms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
  minio_data:
